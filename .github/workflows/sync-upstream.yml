name: Sync Upstream

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/moonbitlang/moonbit-agent-guide.git
          git fetch upstream

      - name: Check for updates
        id: check_updates
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          if [ "$LOCAL" != "$UPSTREAM" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "upstream_sha=$UPSTREAM" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR branch
        if: steps.check_updates.outputs.has_updates == 'true'
        run: |
          BRANCH="sync-upstream-$(date +'%Y%m%d-%H%M%S')"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
        id: create_branch

      - name: Merge upstream
        if: steps.check_updates.outputs.has_updates == 'true'
        continue-on-error: true
        run: |
          git merge upstream/main --no-edit -m "Merge upstream/main into ${GITHUB_REF#refs/heads/}"

      - name: Push PR branch
        if: steps.check_updates.outputs.has_updates == 'true'
        env:
          PR_BRANCH: ${{ steps.create_branch.outputs.branch }}
        run: |
          git push origin "$PR_BRANCH" --force

      - name: Create Pull Request
        if: steps.check_updates.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.create_branch.outputs.branch }}
        run: |
          gh pr create \
            --base fork \
            --head "$PR_BRANCH" \
            --title "Sync upstream/main ($(date +'%Y-%m-%d'))" \
            --body "Automated sync with upstream/main" || true
